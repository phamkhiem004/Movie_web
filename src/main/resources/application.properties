spring.application.name=demo
spring.datasource.url=jdbc:mysql://localhost:3306/movie_project
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=8080
spring.security.user.name=khiem
spring.security.user.password=123456
#openssl rand -base64 64
#config JWT
khiem.jwt.base64-secret=${JWT_SECRET}
#time expiration
khiem.jwt.token-validity-in-seconds=86400
# ===============================
# Swagger / OpenAPI
# ===============================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ???ng d?n swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# fix l?i generic response
springdoc.override-with-generic-response=false

# disable petstore default
springdoc.swagger-ui.disable-swagger-default-url=true


#Cau hinh API Document
open.api.title = API Document
open.api.version = v1.0.0
open.api.description = Mota API Service
open.api.serverUrl = http://localhost:8080
open.api.serverName = server test

# C?u hình g?i mail
spring.mail.from = ${MAIL_FROM:anucius1@gmail.com}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=anucius1@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true
