services:
  mysql-db:
    image: mysql:8.0
    container_name: movie-mysql
    environment:
      MYSQL_DATABASE: movie_project
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  movie-api:
    build: .
    container_name: movie-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/movie_project
      - SPRING_DATASOURCE_USERNAME=root
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql-db:
        condition: service_healthy

  api-test:
    image: api-image-sample
    container_name: movie-container-test
    ports:
      - "8081:8080" # Chạy cổng 8081
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

volumes:
  mysql_data: